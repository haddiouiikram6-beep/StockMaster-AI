services:
  postgres:
    image: postgres:16-alpine
    container_name: stockmaster-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-stockmaster}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-stockmaster}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: stockmaster-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-stockmaster}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DIALECT: postgres
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-stockmaster_jwt_secret_access_production_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-stockmaster_jwt_secret_refresh_production_key_2026}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "3000:3000"
    command: >
      sh -c "npx sequelize-cli db:migrate &&
             node src/server.js"

volumes:
  pgdata:
    driver: local